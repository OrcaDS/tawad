name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: dbt build on fixture bronze
        run: |
          uv run python tests/fixtures/build_bronze.py
          uv run tawad transform
          uv run pytest -q tests/test_queries.py
        env:
          LAKE_ROOT: tests/fixtures/parquet

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tawad-pipeline:ci .
      - name: Smoke test
        run: docker run --rm tawad-pipeline:ci show-config
