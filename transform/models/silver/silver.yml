  - name: test_headline_price_and_basis
    model: stg_da_prices
    given:
      - input: ref('commodity_map')
        rows: []
      - input: ref('markets')
        rows: []
      - input: source('bronze', 'da_prices')
        format: csv
        rows: |
          report_date,series,revision_rank,price_low_raw,price_high_raw,price_prevailing_raw,price_average_raw
          2024-02-01,price_monitoring,0,40.00,60.00,55.00,
          2024-02-02,price_monitoring,0,40.00,60.00,n/a,
          2024-02-03,price_monitoring,0,50.00,50.00,,
          2024-02-04,weekly_avg,0,,,,48.50
          2024-02-05,price_monitoring,0,40.00,n/a,,
          2024-02-06,price_monitoring,0,n/a,n/a,n/a,
    expect:
      format: csv
      rows: |
        report_date,price,price_basis
        2024-02-01,55.0,prevailing
        2024-02-02,50.0,midpoint
        2024-02-03,50.0,single
        2024-02-04,48.5,average
        2024-02-05,40.0,single
        2024-02-06,,

  - name: test_only_latest_revision_kept
    model: stg_da_prices
    given:
      - input: ref('commodity_map')
        rows: []
      - input: ref('markets')
        rows: []
      - input: source('bronze', 'da_prices')
        format: csv
        rows: |
          report_date,series,revision_rank,source_file
          2024-03-01,price_monitoring,0,original.pdf
          2024-03-01,price_monitoring,1,revised.pdf
          2024-03-01,daily_index,0,dpi.pdf
          2024-03-02,price_monitoring,0,next-day.pdf
