version: 2

models:
  - name: stg_da_prices
    description: >-
      DA price rows, one per extracted price cell, latest revision of each report only.
      Prices are numbers or NULL (never 0). `price` is the headline price: prevailing, else
      the low/high midpoint, else the weekly average.
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: page_type
        data_tests: [not_null]
      - name: price_basis
        description: Which column `price` came from. NULL when the row has no price.
        data_tests:
          - accepted_values:
              arguments:
                values: [prevailing, midpoint, average, single]

unit_tests:
  - name: test_parse_price_cleans_or_nulls_every_raw_shape
    description: One row per kind of raw price text seen in the lake (2026-10-28 survey).
    model: stg_da_prices
    given:
      - input: ref('commodity_map')
        rows: []
      - input: ref('markets')
        rows: []
      - input: source('bronze', 'da_prices')
        format: csv
        rows: |
          report_date,series,revision_rank,price_prevailing_raw
          2024-01-01,price_monitoring,0,53.38
          2024-01-02,price_monitoring,0,2 7.00
          2024-01-03,price_monitoring,0,5 .00
          2024-01-04,price_monitoring,0,( 50.00)
          2024-01-05,price_monitoring,0,**35.00
          2024-01-06,price_monitoring,0,50.00***
          2024-01-07,price_monitoring,0,100*
          2024-01-08,price_monitoring,0,"1,000.00"
          2024-01-09,price_monitoring,0,g 60
          2024-01-10,price_monitoring,0,kg 60
          2024-01-11,price_monitoring,0,E160.00
          2024-01-12,price_monitoring,0,145.00N
          2024-01-13,price_monitoring,0,0
          2024-01-14,price_monitoring,0,0.00
          2024-01-15,price_monitoring,0,n/a
          2024-01-16,price_monitoring,0,#N/A
          2024-01-17,price_monitoring,0,#DIV/0!
          2024-01-18,price_monitoring,0,-
          2024-01-19,price_monitoring,0,(-)
          2024-01-20,price_monitoring,0,NOT AVAILABLE
          2024-01-21,price_monitoring,0,NOT AVAILA4B00LE.00
          2024-01-22,price_monitoring,0,0.00n/m0.00
