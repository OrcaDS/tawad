  - name: test_headline_price_and_basis
    model: stg_da_prices
    given:
      - input: ref('commodity_map')
        rows: []
      - input: ref('markets')
        rows: []
      - input: source('bronze', 'da_prices')
        format: csv
        rows: |
          report_date,series,revision_rank,price_low_raw,price_high_raw,price_prevailing_raw,price_average_raw
          2024-02-01,price_monitoring,0,40.00,60.00,55.00,
          2024-02-02,price_monitoring,0,40.00,60.00,n/a,
          2024-02-03,price_monitoring,0,50.00,50.00,,
